name: sim_manager
description: SIM 卡管理工具 MVP
publish_to: "none"
version: 3.3.0+7

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/geo/countries-110m.json
  fonts:
    # Twemoji country flags (CC-BY 4.0 art, MIT font build by TalkJS): Windows
    # has no flag emoji glyphs, so flags are drawn from this bundled font.
    - family: TwemojiCountryFlags
      fonts:
        - asset: assets/fonts/TwemojiCountryFlags.ttf
